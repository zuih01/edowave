<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PROPUESTA (no implementada), paleta "atardecer": mismo diseño que icono-estudio-vinilo-atardecer.svg,
       pero en lugar del vinilo hay un carrete de cinta (claro, con 4 agujeros que dejan ver la cinta enrollada). Estilo Fluent. -->
  <defs>
    <!-- Cuadrado: durazno a coral y magenta -->
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffb36b" />
      <stop offset="0.55" stop-color="#ff6a5c" />
      <stop offset="1" stop-color="#d63a7a" />
    </linearGradient>
    <radialGradient id="tileLight" cx="0.25" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Aro claro -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0dc" />
      <stop offset="1" stop-color="#ffb38f" />
    </linearGradient>
    <!-- Cinta enrollada (se ve por los agujeros): ciruela -->
    <radialGradient id="tape" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7a2f6b" />
      <stop offset="0.55" stop-color="#4a1747" />
      <stop offset="1" stop-color="#2a0b2b" />
    </radialGradient>
    <!-- Carrete crema con luz arriba a la izquierda -->
    <linearGradient id="reel" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.6" stop-color="#fff2ea" />
      <stop offset="1" stop-color="#ffd9c8" />
    </linearGradient>
    <!-- Agujeros del carrete: 4 grandes en diagonal + el del centro -->
    <mask id="holes">
      <rect width="256" height="256" fill="#fff" />
      <circle cx="101.5" cy="95.5" r="20" fill="#000" />
      <circle cx="154.5" cy="95.5" r="20" fill="#000" />
      <circle cx="154.5" cy="148.5" r="20" fill="#000" />
      <circle cx="101.5" cy="148.5" r="20" fill="#000" />
      <circle cx="128" cy="122" r="7" fill="#000" />
    </mask>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5a0d2e" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffd0b0" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Sombra suave en el piso -->
  <ellipse cx="128" cy="230" rx="86" ry="11" fill="#3a0a1c" opacity="0.32" filter="url(#ground)" />

  <!-- Cuadrado redondeado (mismas medidas que el ícono aprobado) -->
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tile)" />
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tileLight)" />

  <!-- Aro claro + cinta enrollada, en su propia capa -->
  <g filter="url(#lift)">
    <circle cx="128" cy="122" r="78" fill="url(#ring)" />
    <circle cx="128" cy="122" r="71" fill="url(#tape)" />
  </g>
  <!-- Un par de vueltas de cinta visibles en el borde -->
  <circle cx="128" cy="122" r="67" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Carrete con sus agujeros -->
  <g filter="url(#glow)">
    <circle cx="128" cy="122" r="62" fill="url(#reel)" mask="url(#holes)" />
  </g>
  <!-- Eje del centro -->
  <circle cx="128" cy="122" r="12" fill="none" stroke="#ffd9c8" stroke-width="3" />
</svg>
