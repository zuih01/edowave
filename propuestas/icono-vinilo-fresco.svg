<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PROPUESTA (no implementada): vinilo saliendo de su funda, sobre un cuadrado menta → celeste → lila. Estilo Fluent. -->
  <defs>
    <!-- Fondo fresco en diagonal -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef0d6" />
      <stop offset="0.5" stop-color="#6cc8ff" />
      <stop offset="1" stop-color="#a58bff" />
    </linearGradient>
    <radialGradient id="tileLight" cx="0.25" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Disco azul noche (más fresco que el negro puro) -->
    <radialGradient id="disc" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3b4270" />
      <stop offset="0.6" stop-color="#1d2142" />
      <stop offset="1" stop-color="#0f1126" />
    </radialGradient>
    <!-- Reflejo con el color del fondo -->
    <linearGradient id="gleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff5e4" stop-opacity="0.45" />
      <stop offset="1" stop-color="#9ff5e4" stop-opacity="0" />
    </linearGradient>
    <!-- Etiqueta coral -->
    <linearGradient id="label" x1="0.2" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffb199" />
      <stop offset="1" stop-color="#ff5f6d" />
    </linearGradient>
    <!-- Funda blanca -->
    <linearGradient id="sleeve" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e6ecfa" />
    </linearGradient>
    <clipPath id="discClip">
      <circle cx="164" cy="122" r="58" />
    </clipPath>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2b2a6b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sombra suave en el piso -->
  <ellipse cx="128" cy="230" rx="86" ry="11" fill="#14123a" opacity="0.3" filter="url(#ground)" />

  <!-- Cuadrado redondeado (mismas medidas que el ícono aprobado) -->
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tile)" />
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tileLight)" />

  <!-- Disco asomando por la derecha -->
  <g filter="url(#lift)">
    <circle cx="164" cy="122" r="58" fill="url(#disc)" />
  </g>
  <circle cx="164" cy="122" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" />
  <g clip-path="url(#discClip)">
    <path d="M164 122 L206 44 A90 90 0 0 1 244 92 Z" fill="url(#gleam)" />
  </g>
  <circle cx="164" cy="122" r="20" fill="url(#label)" />
  <circle cx="164" cy="122" r="5" fill="#fff4f0" />

  <!-- Funda adelante, un poco inclinada -->
  <g filter="url(#lift)">
    <rect x="42" y="66" width="90" height="112" rx="16" fill="url(#sleeve)" transform="rotate(-8 87 122)" />
  </g>
  <!-- Ventanita redonda en la funda, en coral, para que se lea como portada -->
  <circle cx="87" cy="122" r="16" fill="url(#label)" opacity="0.9" />
  <circle cx="87" cy="122" r="6" fill="#ffffff" opacity="0.9" />
</svg>
