<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PROPUESTA (no implementada): igual que icono-estudio-violeta.svg (cuadrado violeta, círculo con aro claro),
       pero el círculo es un vinilo índigo en lugar de la onda de audio. Estilo Fluent. -->
  <defs>
    <!-- Cuadrado: violeta brillante a morado profundo -->
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8b6bff" />
      <stop offset="0.55" stop-color="#5b3df0" />
      <stop offset="1" stop-color="#3a1fb8" />
    </linearGradient>
    <radialGradient id="tileLight" cx="0.25" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Vinilo índigo oscuro con volumen -->
    <radialGradient id="disc" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4a36d6" />
      <stop offset="0.55" stop-color="#2a1896" />
      <stop offset="1" stop-color="#170b5c" />
    </radialGradient>
    <!-- Aro claro del círculo -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4dcff" />
      <stop offset="1" stop-color="#a996ff" />
    </linearGradient>
    <!-- Reflejos lila sobre el disco -->
    <linearGradient id="gleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ceff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#d9ceff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gleam2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b9a8ff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#b9a8ff" stop-opacity="0" />
    </linearGradient>
    <!-- Etiqueta blanca con un leve lila -->
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e2dbff" />
    </linearGradient>
    <clipPath id="discClip">
      <circle cx="128" cy="122" r="71" />
    </clipPath>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1a0a5e" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#c9bcff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Sombra suave en el piso -->
  <ellipse cx="128" cy="230" rx="86" ry="11" fill="#12063a" opacity="0.32" filter="url(#ground)" />

  <!-- Cuadrado redondeado (mismas medidas que el ícono aprobado) -->
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tile)" />
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tileLight)" />

  <!-- Aro claro + vinilo, en su propia capa -->
  <g filter="url(#lift)">
    <circle cx="128" cy="122" r="78" fill="url(#ring)" />
    <circle cx="128" cy="122" r="71" fill="url(#disc)" />
  </g>
  <!-- Surcos anchos -->
  <circle cx="128" cy="122" r="57" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" />
  <circle cx="128" cy="122" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" />
  <!-- Reflejos en cuña -->
  <g clip-path="url(#discClip)">
    <path d="M128 122 L62 42 A105 105 0 0 1 120 16 Z" fill="url(#gleam)" />
    <path d="M128 122 L194 202 A105 105 0 0 1 136 228 Z" fill="url(#gleam2)" />
  </g>
  <!-- Etiqueta blanca con brillo (el "trazo blanco" del estilo original) y agujero índigo -->
  <circle cx="128" cy="122" r="25" fill="url(#label)" filter="url(#glow)" />
  <circle cx="128" cy="122" r="6" fill="#2a1896" />
</svg>
