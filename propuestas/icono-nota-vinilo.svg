<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PROPUESTA (no implementada): cuadrado redondeado rosa con una nota musical blanca cuya cabeza es un disquito de vinilo. -->
  <defs>
    <!-- Fondo: rosa claro arriba a rosa intenso abajo, muy suave -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7728c" />
      <stop offset="1" stop-color="#e83d63" />
    </linearGradient>
    <!-- Luz suave arriba -->
    <radialGradient id="tileLight" cx="0.3" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Símbolo: blanco que se tiñe apenas de rosa hacia abajo -->
    <linearGradient id="glyph" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ffd9e1" />
    </linearGradient>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#8a0f33" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sombra suave en el piso -->
  <ellipse cx="128" cy="230" rx="86" ry="11" fill="#2a0718" opacity="0.3" filter="url(#ground)" />

  <!-- Cuadrado redondeado -->
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tile)" />
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tileLight)" />

  <!-- Nota: plica + banderín redondeado + cabeza en forma de vinilo -->
  <g filter="url(#lift)" fill="url(#glyph)">
    <rect x="132" y="58" width="18" height="110" rx="9" />
    <path d="M141 58 C 166 62 188 78 186 108 C 185 117 175 119 172 110 C 167 94 156 86 141 84 Z" />
    <circle cx="112" cy="164" r="38" />
  </g>
  <!-- Detalles del disquito: un surco y el agujero, en rosa -->
  <circle cx="112" cy="164" r="26" fill="none" stroke="#f0577a" stroke-opacity="0.35" stroke-width="3" />
  <circle cx="112" cy="164" r="11" fill="#f0577a" />
  <circle cx="112" cy="164" r="4" fill="#ffffff" />
</svg>
