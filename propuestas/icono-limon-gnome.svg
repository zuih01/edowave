<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- PROPUESTA "Limón partido" en estilo GNOME (HIG app icons): lienzo 128, vista de frente-arriba (la cara del
       corte arriba, la media esfera de cáscara abajo), luz desde arriba, degradado solo en la parte curva,
       colores de la paleta GNOME, sin sombra por fuera de la silueta. -->
  <defs>
    <linearGradient id="cascara" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5a50a" />
      <stop offset="0.4" stop-color="#f6d32d" />
      <stop offset="1" stop-color="#e5a50a" />
    </linearGradient>
  </defs>

  <!-- Media esfera de cáscara con su puntita -->
  <path d="M12 54 C 12 90, 36 112, 64 112 C 92 112, 116 90, 116 54 Z" fill="url(#cascara)" />
  <path d="M58 111 C 59 117, 69 117, 70 111 Z" fill="#e5a50a" />

  <!-- Cara del corte (vista un poco desde arriba: se aplasta en vertical) -->
  <g transform="translate(0 52) scale(1 0.82) translate(0 -52)">
    <circle cx="64" cy="52" r="52" fill="#f6d32d" />
    <circle cx="64" cy="52" r="48" fill="#f6f5f4" />
    <!-- Gajos -->
    <g fill="#f9f06b" stroke="#f9f06b" stroke-width="4" stroke-linejoin="round"><path d="M67.1 44.6 L66.4 13.1 A39 39 0 0 1 89.8 22.8 Z" /><path d="M71.4 48.9 L93.2 26.2 A39 39 0 0 1 102.9 49.6 Z" /><path d="M71.4 55.1 L102.9 54.4 A39 39 0 0 1 93.2 77.8 Z" /><path d="M67.1 59.4 L89.8 81.2 A39 39 0 0 1 66.4 90.9 Z" /><path d="M60.9 59.4 L61.6 90.9 A39 39 0 0 1 38.2 81.2 Z" /><path d="M56.6 55.1 L34.8 77.8 A39 39 0 0 1 25.1 54.4 Z" /><path d="M56.6 48.9 L25.1 49.6 A39 39 0 0 1 34.8 26.2 Z" /><path d="M60.9 44.6 L38.2 22.8 A39 39 0 0 1 61.6 13.1 Z" /></g>
    <!-- Pepitas -->
    <g fill="#ffffff" stroke="#deddda" stroke-width="1"><ellipse cx="82.5" cy="44.3" rx="2.6" ry="4.2" transform="rotate(67.5 82.5 44.3)" /><ellipse cx="45.5" cy="59.7" rx="2.6" ry="4.2" transform="rotate(247.5 45.5 59.7)" /></g>
  </g>
  <!-- Brillo de jugo -->
  <ellipse cx="44" cy="36" rx="9" ry="3.5" transform="rotate(-25 44 36)" fill="#ffffff" opacity="0.6" />
</svg>
