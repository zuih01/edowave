<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Ícono de la app, estilo Fluent (Windows 11): círculo con degradado suave, nota en una capa encima y sombra abajo. -->
  <defs>
    <!-- Círculo rosa, el color de la app, con un toque morado abajo -->
    <linearGradient id="disc" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ff8fa3" />
      <stop offset="0.5" stop-color="#ff4e6a" />
      <stop offset="1" stop-color="#c8287a" />
    </linearGradient>
    <!-- Brillo suave arriba a la izquierda -->
    <radialGradient id="shine" cx="0.32" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Nota: blanca con un leve rosado abajo -->
    <linearGradient id="note" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ffd6df" />
    </linearGradient>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7a0f3a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Sombra suave en el piso -->
  <ellipse cx="128" cy="228" rx="78" ry="11" fill="#2a0718" opacity="0.32" filter="url(#ground)" />

  <!-- Círculo -->
  <circle cx="128" cy="122" r="96" fill="url(#disc)" />
  <circle cx="128" cy="122" r="96" fill="url(#shine)" />

  <!-- Nota musical (corchea), en su propia capa con sombra sobre el círculo -->
  <g filter="url(#lift)" fill="url(#note)">
    <ellipse cx="110" cy="158" rx="27" ry="21" transform="rotate(-22 110 158)" />
    <rect x="121" y="66" width="16" height="94" rx="8" />
    <path d="M129 66 C 152 70 172 84 170 112 C 169 120 160 121 158 113 C 155 99 146 92 129 90 Z" />
  </g>
</svg>
