<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PROPUESTA "Kiwi": mismo esquema que el ícono aprobado (cuadrado redondeado, círculo con aro claro y sombra,
       etiqueta central con brillo), pero el círculo es una rodaja de kiwi. Estilo Fluent. -->
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9be15d" />
      <stop offset="0.55" stop-color="#4caf3e" />
      <stop offset="1" stop-color="#1f7a3a" />
    </linearGradient>
    <radialGradient id="tileLight" cx="0.25" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Cáscara café -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98a55" />
      <stop offset="1" stop-color="#6b4826" />
    </linearGradient>
    <!-- Pulpa verde con volumen: clara al centro, intensa al borde -->
    <radialGradient id="flesh" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e9f9a8" />
      <stop offset="0.45" stop-color="#a7dc45" />
      <stop offset="1" stop-color="#5fa621" />
    </radialGradient>
    <!-- Corazón crema -->
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f1f6d2" />
    </radialGradient>
    <linearGradient id="gleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="fleshClip"><circle cx="128" cy="122" r="71" /></clipPath>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" /></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b3d1c" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f4ffd0" flood-opacity="0.8" />
    </filter>
  </defs>

  <ellipse cx="128" cy="230" rx="86" ry="11" fill="#08321a" opacity="0.32" filter="url(#ground)" />

  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tile)" />
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tileLight)" />

  <!-- Cáscara + pulpa -->
  <g filter="url(#lift)">
    <circle cx="128" cy="122" r="78" fill="url(#ring)" />
    <circle cx="128" cy="122" r="71" fill="url(#flesh)" />
  </g>
  <g clip-path="url(#fleshClip)">
    <!-- Fibras que salen del centro -->
    <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.6" stroke-linecap="round"><line x1="155.0" y1="122.0" x2="190.0" y2="122.0" /><line x1="154.4" y1="127.6" x2="188.6" y2="134.9" /><line x1="152.7" y1="133.0" x2="184.6" y2="147.2" /><line x1="149.8" y1="137.9" x2="178.2" y2="158.4" /><line x1="146.1" y1="142.1" x2="169.5" y2="168.1" /><line x1="141.5" y1="145.4" x2="159.0" y2="175.7" /><line x1="136.3" y1="147.7" x2="147.2" y2="181.0" /><line x1="130.8" y1="148.9" x2="134.5" y2="183.7" /><line x1="125.2" y1="148.9" x2="121.5" y2="183.7" /><line x1="119.7" y1="147.7" x2="108.8" y2="181.0" /><line x1="114.5" y1="145.4" x2="97.0" y2="175.7" /><line x1="109.9" y1="142.1" x2="86.5" y2="168.1" /><line x1="106.2" y1="137.9" x2="77.8" y2="158.4" /><line x1="103.3" y1="133.0" x2="71.4" y2="147.2" /><line x1="101.6" y1="127.6" x2="67.4" y2="134.9" /><line x1="101.0" y1="122.0" x2="66.0" y2="122.0" /><line x1="101.6" y1="116.4" x2="67.4" y2="109.1" /><line x1="103.3" y1="111.0" x2="71.4" y2="96.8" /><line x1="106.2" y1="106.1" x2="77.8" y2="85.6" /><line x1="109.9" y1="101.9" x2="86.5" y2="75.9" /><line x1="114.5" y1="98.6" x2="97.0" y2="68.3" /><line x1="119.7" y1="96.3" x2="108.8" y2="63.0" /><line x1="125.2" y1="95.1" x2="121.5" y2="60.3" /><line x1="130.8" y1="95.1" x2="134.5" y2="60.3" /><line x1="136.3" y1="96.3" x2="147.2" y2="63.0" /><line x1="141.5" y1="98.6" x2="159.0" y2="68.3" /><line x1="146.1" y1="101.9" x2="169.5" y2="75.9" /><line x1="149.8" y1="106.1" x2="178.2" y2="85.6" /><line x1="152.7" y1="111.0" x2="184.6" y2="96.8" /><line x1="154.4" y1="116.4" x2="188.6" y2="109.1" /></g>
    <!-- Semillas -->
    <g fill="#2a1d12"><ellipse cx="164.0" cy="122.0" rx="2.6" ry="5.2" transform="rotate(90.0 164.0 122.0)" /><ellipse cx="161.8" cy="134.3" rx="2.6" ry="5.2" transform="rotate(110.0 161.8 134.3)" /><ellipse cx="155.6" cy="145.1" rx="2.6" ry="5.2" transform="rotate(130.0 155.6 145.1)" /><ellipse cx="146.0" cy="153.2" rx="2.6" ry="5.2" transform="rotate(150.0 146.0 153.2)" /><ellipse cx="134.3" cy="157.5" rx="2.6" ry="5.2" transform="rotate(170.0 134.3 157.5)" /><ellipse cx="121.7" cy="157.5" rx="2.6" ry="5.2" transform="rotate(190.0 121.7 157.5)" /><ellipse cx="110.0" cy="153.2" rx="2.6" ry="5.2" transform="rotate(210.0 110.0 153.2)" /><ellipse cx="100.4" cy="145.1" rx="2.6" ry="5.2" transform="rotate(230.0 100.4 145.1)" /><ellipse cx="94.2" cy="134.3" rx="2.6" ry="5.2" transform="rotate(250.0 94.2 134.3)" /><ellipse cx="92.0" cy="122.0" rx="2.6" ry="5.2" transform="rotate(270.0 92.0 122.0)" /><ellipse cx="94.2" cy="109.7" rx="2.6" ry="5.2" transform="rotate(290.0 94.2 109.7)" /><ellipse cx="100.4" cy="98.9" rx="2.6" ry="5.2" transform="rotate(310.0 100.4 98.9)" /><ellipse cx="110.0" cy="90.8" rx="2.6" ry="5.2" transform="rotate(330.0 110.0 90.8)" /><ellipse cx="121.7" cy="86.5" rx="2.6" ry="5.2" transform="rotate(350.0 121.7 86.5)" /><ellipse cx="134.3" cy="86.5" rx="2.6" ry="5.2" transform="rotate(370.0 134.3 86.5)" /><ellipse cx="146.0" cy="90.8" rx="2.6" ry="5.2" transform="rotate(390.0 146.0 90.8)" /><ellipse cx="155.6" cy="98.9" rx="2.6" ry="5.2" transform="rotate(410.0 155.6 98.9)" /><ellipse cx="161.8" cy="109.7" rx="2.6" ry="5.2" transform="rotate(430.0 161.8 109.7)" /><ellipse cx="173.6" cy="128.4" rx="2.4" ry="4.8" transform="rotate(98.0 173.6 128.4)" /><ellipse cx="169.9" cy="141.0" rx="2.4" ry="4.8" transform="rotate(114.4 169.9 141.0)" /><ellipse cx="162.9" cy="152.0" rx="2.4" ry="4.8" transform="rotate(130.7 162.9 152.0)" /><ellipse cx="153.0" cy="160.6" rx="2.4" ry="4.8" transform="rotate(147.1 153.0 160.6)" /><ellipse cx="141.1" cy="166.1" rx="2.4" ry="4.8" transform="rotate(163.5 141.1 166.1)" /><ellipse cx="128.1" cy="168.0" rx="2.4" ry="4.8" transform="rotate(179.8 128.1 168.0)" /><ellipse cx="115.2" cy="166.2" rx="2.4" ry="4.8" transform="rotate(196.2 115.2 166.2)" /><ellipse cx="103.3" cy="160.8" rx="2.4" ry="4.8" transform="rotate(212.5 103.3 160.8)" /><ellipse cx="93.3" cy="152.2" rx="2.4" ry="4.8" transform="rotate(228.9 93.3 152.2)" /><ellipse cx="86.2" cy="141.2" rx="2.4" ry="4.8" transform="rotate(245.3 86.2 141.2)" /><ellipse cx="82.5" cy="128.7" rx="2.4" ry="4.8" transform="rotate(261.6 82.5 128.7)" /><ellipse cx="82.4" cy="115.6" rx="2.4" ry="4.8" transform="rotate(278.0 82.4 115.6)" /><ellipse cx="86.1" cy="103.0" rx="2.4" ry="4.8" transform="rotate(294.4 86.1 103.0)" /><ellipse cx="93.1" cy="92.0" rx="2.4" ry="4.8" transform="rotate(310.7 93.1 92.0)" /><ellipse cx="103.0" cy="83.4" rx="2.4" ry="4.8" transform="rotate(327.1 103.0 83.4)" /><ellipse cx="114.9" cy="77.9" rx="2.4" ry="4.8" transform="rotate(343.5 114.9 77.9)" /><ellipse cx="127.9" cy="76.0" rx="2.4" ry="4.8" transform="rotate(359.8 127.9 76.0)" /><ellipse cx="140.8" cy="77.8" rx="2.4" ry="4.8" transform="rotate(376.2 140.8 77.8)" /><ellipse cx="152.7" cy="83.2" rx="2.4" ry="4.8" transform="rotate(392.5 152.7 83.2)" /><ellipse cx="162.7" cy="91.8" rx="2.4" ry="4.8" transform="rotate(408.9 162.7 91.8)" /><ellipse cx="169.8" cy="102.8" rx="2.4" ry="4.8" transform="rotate(425.3 169.8 102.8)" /><ellipse cx="173.5" cy="115.3" rx="2.4" ry="4.8" transform="rotate(441.6 173.5 115.3)" /></g>
    <!-- Reflejo en cuña -->
    <path d="M128 122 L62 42 A105 105 0 0 1 120 16 Z" fill="url(#gleam)" />
  </g>
  <!-- Corazón claro con brillo (el "trazo blanco" del estilo) -->
  <ellipse cx="128" cy="122" rx="24" ry="20" fill="url(#core)" filter="url(#glow)" />
</svg>
