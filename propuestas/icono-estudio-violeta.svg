<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PROPUESTA (no implementada): guiño a los colores de un editor de audio profesional.
       Cuadrado violeta, círculo índigo con aro claro y una onda de audio blanca. Estilo Fluent. -->
  <defs>
    <!-- Cuadrado: violeta brillante a morado profundo -->
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8b6bff" />
      <stop offset="0.55" stop-color="#5b3df0" />
      <stop offset="1" stop-color="#3a1fb8" />
    </linearGradient>
    <radialGradient id="tileLight" cx="0.25" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Círculo interior índigo, con brillo arriba -->
    <radialGradient id="disc" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6a52ff" />
      <stop offset="0.6" stop-color="#3b23c9" />
      <stop offset="1" stop-color="#25137f" />
    </radialGradient>
    <!-- Aro claro del círculo -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4dcff" />
      <stop offset="1" stop-color="#a996ff" />
    </linearGradient>
    <!-- Onda blanca con un leve lila abajo -->
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e2dbff" />
    </linearGradient>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1a0a5e" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#c9bcff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Sombra suave en el piso -->
  <ellipse cx="128" cy="230" rx="86" ry="11" fill="#12063a" opacity="0.32" filter="url(#ground)" />

  <!-- Cuadrado redondeado (mismas medidas que el ícono aprobado) -->
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tile)" />
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tileLight)" />

  <!-- Círculo con aro, en su propia capa -->
  <g filter="url(#lift)">
    <circle cx="128" cy="122" r="78" fill="url(#ring)" />
    <circle cx="128" cy="122" r="71" fill="url(#disc)" />
  </g>

  <!-- Onda de audio: barras redondeadas de distinta altura (simétrica arriba/abajo) -->
  <g fill="url(#wave)" filter="url(#glow)">
    <rect x="77" y="113" width="10" height="18" rx="5" />
    <rect x="93" y="98" width="10" height="48" rx="5" />
    <rect x="109" y="80" width="10" height="84" rx="5" />
    <rect x="125" y="68" width="10" height="108" rx="5" />
    <rect x="141" y="88" width="10" height="68" rx="5" />
    <rect x="157" y="102" width="10" height="40" rx="5" />
    <rect x="173" y="114" width="10" height="16" rx="5" />
  </g>
</svg>
