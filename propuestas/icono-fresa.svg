<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PROPUESTA "Fresa": mismo esquema que el ícono aprobado (cuadrado redondeado con brillo, figura central con
       sombra y volumen, brillo blanco). Estilo Fluent. -->
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffb3c4" />
      <stop offset="0.55" stop-color="#ff6b8b" />
      <stop offset="1" stop-color="#d93a5e" />
    </linearGradient>
    <radialGradient id="tileLight" cx="0.25" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="berry" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ff5a5f" />
      <stop offset="0.55" stop-color="#e01f3d" />
      <stop offset="1" stop-color="#9c0f2c" />
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd858" />
      <stop offset="1" stop-color="#2f9a3b" />
    </linearGradient>
    <linearGradient id="gleam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="berryClip"><path d="M128 198 C 96 188, 64 152, 64 112 C 64 86, 90 74, 128 80 C 166 74, 192 86, 192 112 C 192 152, 160 188, 128 198 Z" /></clipPath>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" /></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6b0a24" flood-opacity="0.45" />
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2" /></filter>
  </defs>

  <ellipse cx="128" cy="230" rx="86" ry="11" fill="#4a0618" opacity="0.32" filter="url(#ground)" />

  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tile)" />
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tileLight)" />

  <!-- Fresa -->
  <g filter="url(#lift)">
    <path d="M128 198 C 96 188, 64 152, 64 112 C 64 86, 90 74, 128 80 C 166 74, 192 86, 192 112 C 192 152, 160 188, 128 198 Z" fill="url(#berry)" />
  </g>
  <g clip-path="url(#berryClip)">
    <!-- Semillas -->
    <g fill="#ffe08a"><ellipse cx="83.0" cy="110" rx="2.4" ry="4" transform="rotate(-15.7 83.0 110)" /><ellipse cx="173.0" cy="110" rx="2.4" ry="4" transform="rotate(15.7 173.0 110)" /><ellipse cx="92.0" cy="124" rx="2.4" ry="4" transform="rotate(-12.6 92.0 124)" /><ellipse cx="110.0" cy="124" rx="2.4" ry="4" transform="rotate(-6.3 110.0 124)" /><ellipse cx="128.0" cy="124" rx="2.4" ry="4" transform="rotate(0.0 128.0 124)" /><ellipse cx="146.0" cy="124" rx="2.4" ry="4" transform="rotate(6.3 146.0 124)" /><ellipse cx="164.0" cy="124" rx="2.4" ry="4" transform="rotate(12.6 164.0 124)" /><ellipse cx="101.0" cy="138" rx="2.4" ry="4" transform="rotate(-9.4 101.0 138)" /><ellipse cx="119.0" cy="138" rx="2.4" ry="4" transform="rotate(-3.1 119.0 138)" /><ellipse cx="137.0" cy="138" rx="2.4" ry="4" transform="rotate(3.1 137.0 138)" /><ellipse cx="155.0" cy="138" rx="2.4" ry="4" transform="rotate(9.4 155.0 138)" /><ellipse cx="110.0" cy="152" rx="2.4" ry="4" transform="rotate(-6.3 110.0 152)" /><ellipse cx="128.0" cy="152" rx="2.4" ry="4" transform="rotate(0.0 128.0 152)" /><ellipse cx="146.0" cy="152" rx="2.4" ry="4" transform="rotate(6.3 146.0 152)" /><ellipse cx="119.0" cy="166" rx="2.4" ry="4" transform="rotate(-3.1 119.0 166)" /><ellipse cx="137.0" cy="166" rx="2.4" ry="4" transform="rotate(3.1 137.0 166)" /><ellipse cx="128.0" cy="180" rx="2.4" ry="4" transform="rotate(0.0 128.0 180)" /></g>
    <!-- Brillo -->
    <ellipse cx="96" cy="112" rx="14" ry="26" transform="rotate(20 96 112)" fill="url(#gleam)" filter="url(#soft)" />
  </g>
  <!-- Hojas y tallo -->
  <g fill="url(#leaf)" filter="url(#lift)"><path d="M128 84 Q104.8 77.2 88.4 89.6 Q107.6 97.0 128 84 Z" /><path d="M128 84 Q106.6 89.8 101.2 108.1 Q120.0 104.7 128 84 Z" /><path d="M128 84 Q116.5 97.6 123.1 111.6 Q134.2 100.7 128 84 Z" /><path d="M128 84 Q121.8 100.7 132.9 111.6 Q139.5 97.6 128 84 Z" /><path d="M128 84 Q136.0 104.7 154.8 108.1 Q149.4 89.8 128 84 Z" /><path d="M128 84 Q148.4 97.0 167.6 89.6 Q151.2 77.2 128 84 Z" /><circle cx="128" cy="86" r="9" /></g>
  <path d="M128 82 C 128 70, 131 62, 138 56" fill="none" stroke="#2f9a3b" stroke-width="7" stroke-linecap="round" />
</svg>
