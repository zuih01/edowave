<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- PROPUESTA (no implementada): parlante blanco de un solo driver amarillo, dentro de un cuadrado redondeado (fondo rosa). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7728c" />
      <stop offset="1" stop-color="#e83d63" />
    </linearGradient>
    <radialGradient id="tileLight" cx="0.3" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Gabinete blanco con volumen -->
    <linearGradient id="cab" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.65" stop-color="#f3f3f6" />
      <stop offset="1" stop-color="#dedee6" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e2ea" />
      <stop offset="1" stop-color="#b6b6c2" />
    </linearGradient>
    <!-- Driver amarillo: aro, cono y tapa -->
    <!-- Aro de goma negro, como un woofer real (así no se confunde con otra cosa) -->
    <radialGradient id="surround" cx="0.42" cy="0.36" r="0.65">
      <stop offset="0.72" stop-color="#4a4a54" />
      <stop offset="1" stop-color="#1c1c22" />
    </radialGradient>
    <radialGradient id="cone" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffe46b" />
      <stop offset="0.55" stop-color="#ffcc1a" />
      <stop offset="1" stop-color="#e8a800" />
    </radialGradient>
    <radialGradient id="cap" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff3b8" />
      <stop offset="1" stop-color="#f5bf00" />
    </radialGradient>
    <filter id="ground" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="liftCab" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8a0f33" flood-opacity="0.4" />
    </filter>
    <filter id="liftDrv" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5a4300" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sombra suave en el piso -->
  <ellipse cx="128" cy="230" rx="86" ry="11" fill="#14060e" opacity="0.32" filter="url(#ground)" />

  <!-- Cuadrado redondeado (mismas medidas que el ícono aprobado) -->
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tile)" />
  <rect x="26" y="20" width="204" height="204" rx="52" fill="url(#tileLight)" />

  <!-- Gabinete blanco: canto y frente -->
  <g filter="url(#liftCab)">
    <rect x="74" y="50" width="108" height="148" rx="24" fill="url(#edge)" />
  </g>
  <rect x="74" y="48" width="108" height="144" rx="24" fill="url(#cab)" />

  <!-- Un solo driver, grande -->
  <g filter="url(#liftDrv)">
    <circle cx="128" cy="116" r="44" fill="url(#surround)" />
    <circle cx="128" cy="116" r="34" fill="url(#cone)" />
  </g>
  <circle cx="128" cy="116" r="13" fill="url(#cap)" />
  <!-- Ranura de bajos -->
  <rect x="106" y="174" width="44" height="8" rx="4" fill="#3a3a44" opacity="0.85" />
  <ellipse cx="115" cy="102" rx="13" ry="7" fill="#ffffff" opacity="0.28" transform="rotate(-35 115 102)" />
</svg>
